<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Marketing-Seite ohne Angular</title>
    <style>
      body { font-family: Georgia, serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      #log { background: #f6f7f9; padding: 0.75rem; min-height: 3rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>EventHub Konferenz 2027</h1>
    <p>Diese Seite ist reines HTML (z. B. aus einem CMS). Das Widget kommt aus dem Angular-Build.</p>

    <!-- Inputs als Attribute: sessionTitle -> session-title, maxTickets -> max-tickets -->
    <eventhub-signup session-title="Signals in der Praxis" max-tickets="3"></eventhub-signup>

    <h2>Ereignisse</h2>
    <div id="log">Noch keine Anmeldung.</div>

    <!-- Der Angular-Build: definiert <eventhub-signup> -->
    <script type="module" src="main.js"></script>
    <script>
      const widget = document.querySelector('eventhub-signup');
      const log = document.getElementById('log');

      // Output "registered" kommt als CustomEvent an, die Daten stehen in event.detail.
      widget.addEventListener('registered', (event) => {
        log.textContent = 'Anmeldung: ' + JSON.stringify(event.detail, null, 2);
      });
    </script>
  </body>
</html>
