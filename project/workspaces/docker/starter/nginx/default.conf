# Starter Lab 13.3 – nginx-Konfiguration für die Angular-SPA
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TODO A: Dateien mit Hash im Namen (z. B. main-AB12CD34.js) ein Jahr cachen
    #         Header: Cache-Control "public, max-age=31536000, immutable"

    # TODO B: /config.json nie cachen (Cache-Control "no-store")

    # TODO C: /index.html immer neu prüfen (Cache-Control "no-cache")

    location / {
        # TODO D: SPA-Fallback – existiert die Datei nicht, index.html ausliefern
        try_files $uri =404;
    }
}
