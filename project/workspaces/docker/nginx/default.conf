# nginx-Konfiguration für eine Angular-SPA (Lab 13.3)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Komprimierung für Text-Ressourcen
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Gebündelte Dateien mit Hash im Namen (main-AB12CD.js): ändern sich nie, also ein Jahr cachen
    location ~* "-[0-9a-z]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bilder und Schriften aus public/ haben keinen Hash: kurz cachen
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Laufzeitkonfiguration nie cachen: sie wird beim Containerstart neu geschrieben
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # index.html immer neu prüfen, damit neue Bundles sofort ankommen
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-Fallback: unbekannte Pfade wie /sessions/3 liefern index.html, der Angular-Router übernimmt
    location / {
        try_files $uri $uri/ /index.html;
    }
}
